services:
  postgres:
    image: postgres:18
    env_file: .env
    ports:
      # Host 5433: a native Windows PostgreSQL service already owns 5432.
      - "5433:5432"
    volumes:
      # Postgres 18 stores data under a versioned subfolder, so mount the parent.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      # $$ escapes compose substitution; the container's shell expands the vars.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    # Rate-limit counters (RATE_LIMIT_STORAGE_URL), shared by every FastAPI worker.
    image: redis:8-alpine
    ports:
      # No password, so only reachable from this machine.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
