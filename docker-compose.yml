services:
  postgres:
    image: postgres:18
    # Only what Postgres needs to create the database, not all of .env (which
    # also holds the JWT and internal API secrets). Filled in from .env.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Host port 5433, not the default 5432, so it can't clash with a Postgres
      # installed on the machine itself (it did on the old Windows machine).
      # DATABASE_URL in .env uses 5433. Inside Docker, the backend uses 5432.
      # 127.0.0.1: reachable from this machine only, not the local network.
      - "127.0.0.1:5433:5432"
    volumes:
      # Postgres 18 stores data under a versioned subfolder, so mount the parent.
      - postgres_data:/var/lib/postgresql
    healthcheck:
      # $$ escapes compose substitution; the container's shell expands the vars.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    # Rate-limit counters (RATE_LIMIT_STORAGE_URL), shared by every FastAPI worker.
    image: redis:8-alpine
    ports:
      # No password, so only reachable from this machine.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.40.2
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck: 
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 10

    volumes:
      - ollama_data:/root/.ollama

  # Development containers: the code is mounted in and both reload on save.
  # Inside Docker, services reach each other by service name (postgres, redis,
  # ollama, backend), not localhost, so those URLs are overridden below. .env
  # keeps the localhost values for running things directly on the host.
  backend:
    build: ./Backend
    env_file: .env
    environment:
      # ${...} is filled in by compose from .env, so the password lives only there.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RATE_LIMIT_STORAGE_URL: redis://redis:6379/0
      OLLAMA_URL: http://ollama:11434
    # Sync deps (a no-op unless pyproject.toml/uv.lock changed), migrate, serve.
    command: >-
      sh -c "uv sync --locked --no-install-project
      && uv run --no-sync alembic upgrade head
      && uv run --no-sync uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./Backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  frontend:
    build: ./Frontend
    env_file: ./Frontend/.env.local
    environment:
      API_URL: http://backend:8000
    # Install deps (a no-op unless package.json/bun.lock changed), then serve.
    command: sh -c "bun install --frozen-lockfile && bun run dev --hostname 0.0.0.0"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./Frontend:/app
      # Container-only folders, so they never mix with the host's: Linux
      # node_modules and the dev build cache.
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
  frontend_node_modules:
  frontend_next: